# Build the lerobot-square image (DECISIONS D9). Pull requests build and run the in-image
# smoke check without pushing. Pushes to main also publish to ghcr.io, and the job summary
# records the digest that CLAIX (`apptainer pull docker://ghcr.io/...@sha256:...`) and,
# later, Vertex AI (Artifact Registry mirror, issue #29) must use.
name: container

on:
  pull_request:
    paths:
      - containers/lerobot-square/**
      - requirements/lerobot.txt
      - .github/workflows/container.yml
  push:
    branches: [main]
    paths:
      - containers/lerobot-square/**
      - requirements/lerobot.txt
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hsiang-linc/franka-il-lerobot-square

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # torch + CUDA wheels need ~10 GB; the hosted runner has less free disk by default.
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          docker-images: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/lerobot-square/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### lerobot-square image"
            echo
            echo "\`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
